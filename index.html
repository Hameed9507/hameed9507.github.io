<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دروس تفيدك</title>
<meta name="description" content="دروس ومقاطع تقرّبك من الله وتصلح دينك ودنياك">
<meta property="og:title" content="دروس تفيدك">
<meta property="og:description" content="دروس ومقاطع تقرّبك من الله وتصلح دينك ودنياك">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@500;700;900&display=swap">
<style>
/*
VOICE: هادئ وقور قريب من الناس
IDEA: باب واحد يجمع المواقع، كل موقع بطاقة بلونها
COLOUR and TYPE: رملي دافئ وبني حبري مثل «أرِحنا بها»؛ أميري للعناوين وتجوال للنص
*/
:root{color-scheme:light dark;
 --bg:light-dark(#F7EEDF,#1E1712);--bg2:light-dark(#EFE2CC,#2A2019);--card:light-dark(#FFFBF4,#2B211A);
 --ink:light-dark(#3B2416,#F3E6D3);--soft:light-dark(#7A5A44,#C9B39C);--line:light-dark(#E3D2B6,#3E3127)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.7 Tajawal,'Noto Naskh Arabic',sans-serif;overflow-x:clip}
.wrap{width:100%;max-width:720px;margin:0 auto;padding:0 max(5vw,16px)}

/* header */
header{text-align:center;padding:clamp(36px,8vw,72px) 0 8px}
.mark{width:64px;height:64px;margin:0 auto 6px;display:block;color:var(--soft)}
h1{font:700 clamp(48px,13vw,84px)/1.35 Amiri,serif;margin:0}
.sub{font-weight:700;font-size:clamp(18px,4.8vw,22px);line-height:1.9;margin:6px auto 0;max-width:22em;text-wrap:balance}
.sub span{white-space:nowrap;padding:0 4px;background:linear-gradient(transparent 58%,rgba(224,102,58,.28) 58% 90%,transparent 90%);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.rule{display:flex;align-items:center;justify-content:center;gap:10px;margin:26px auto 0;color:var(--line)}
.rule i{height:1px;width:72px;background:currentColor}
.rule svg{width:16px;height:16px;color:var(--soft);opacity:.7}

/* cards */
main{padding:22px 0 10px}
.sites{list-style:none;margin:0;padding:0;display:grid;gap:16px}
.site{display:flex;align-items:stretch;gap:0;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-bottom:4px solid var(--c);border-radius:22px;overflow:hidden;box-shadow:0 10px 26px rgba(60,30,10,.08);transition:transform .2s,box-shadow .2s}
a.site:hover{transform:translateY(-2px);box-shadow:0 16px 32px rgba(60,30,10,.14)}
a.site:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.thumb{flex:none;width:112px;aspect-ratio:9/16;background:var(--c);position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.body{flex:1;padding:16px 16px 14px;display:flex;flex-direction:column;gap:6px}
.top{display:flex;align-items:center;gap:10px}
.ico{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.ico svg{width:28px;height:28px}
.site h2{font:700 clamp(28px,7.4vw,34px)/1.3 Amiri,serif;margin:0}
.site p{margin:0;font-size:16.5px;line-height:1.65;color:var(--soft);font-weight:500}
.go{margin-top:auto;padding-top:6px;display:inline-flex;align-items:center;gap:6px;font-weight:900;font-size:16px;color:var(--c)}
.go svg{width:18px;height:18px}
.site.soon{background:transparent;border:2px dashed var(--line);box-shadow:none;opacity:.75;--c:var(--soft)}
.site.soon .body{padding:18px;flex-direction:row;align-items:center;gap:12px}
.site.soon h2{font-size:clamp(22px,6vw,26px)}

/* footer */
footer{text-align:center;padding:34px 16px 40px}
.credit{font:700 30px/1.6 Amiri,serif;margin:0 auto;display:table;padding:0 6px;background:linear-gradient(90deg,light-dark(#C4512A,#F2A27A),light-dark(#C98A12,#F3CF72));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;-webkit-text-stroke:.6px light-dark(rgba(196,90,30,.55),rgba(243,190,110,.5))}

@media(prefers-reduced-motion:reduce){a.site{transition:none}a.site:hover{transform:none}}
</style>
</head>
<body>
<div class="wrap">
<header>
 <svg class="mark" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <path d="M10 56V30c0-12 10-21 22-24 12 3 22 12 22 24v26"/>
  <path d="M20 56V34c0-7 5-12 12-15 7 3 12 8 12 15v22"/>
  <path d="M6 56h52"/>
 </svg>
 <h1>دروس تفيدك</h1>
 <p class="sub"><span>دروس ومقاطع تقرّبك من الله</span> <span>وتصلح دينك ودنياك</span></p>
 <div class="rule" aria-hidden="true"><i></i><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="3" fill="currentColor"/></svg><i></i></div>
</header>

<main>
 <ul class="sites" id="sites"></ul>
</main>
</div>

<footer>
 <p class="credit">إعداد: حميد بن علي هزازي</p>
</footer>

<script>
/* لإضافة موقع جديد: سطر واحد في هذه المصفوفة
   icon من الأيقونات في ICONS بالأسفل، وimg اختيارية */
const SITES = [
 {title:"أرِحنا بها", desc:"سلسلة في أحكام الصلاة بالفيديو مع اختبار لكل حلقة", url:"https://hameed9507.github.io/arihna/", color:"#E0663A", icon:"prayer", img:"https://hameed9507.github.io/arihna/ep1.jpg"},
];

const ICONS = {
 /* محراب وسجادة */
 prayer:'<path d="M6 21V11a6 6 0 0 1 12 0v10"/><path d="M9.5 21v-7a2.5 2.5 0 0 1 5 0v7"/><path d="M3 21h18"/>',
 /* ماء */
 water:'<path d="M12 3c3.5 4.5 6 7.8 6 11a6 6 0 0 1-12 0c0-3.2 2.5-6.5 6-11z"/>',
 /* بيت */
 home:'<path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/><path d="M10 20v-5h4v5"/>',
 /* كتاب */
 book:'<path d="M4 5c3-1.5 5.5-1.5 8 0v15c-2.5-1.5-5-1.5-8 0z"/><path d="M20 5c-3-1.5-5.5-1.5-8 0v15c2.5-1.5 5-1.5 8 0z"/>',
 /* ساعة رملية */
 soon:'<path d="M6 3h12M6 21h12"/><path d="M8 3v3c0 2.5 4 4 4 6s-4 3.5-4 6v3"/><path d="M16 3v3c0 2.5-4 4-4 6s4 3.5 4 6v3"/><path d="M10 19h4"/>'
};
const svg = k => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ICONS[k]||ICONS.book)+'</svg>';
const arrow = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const list = document.getElementById('sites');
list.innerHTML = SITES.map(s => `
 <li><a class="site" href="${esc(s.url)}" style="--c:${esc(s.color)}">
  ${s.img ? `<span class="thumb"><img src="${esc(s.img)}" alt="" loading="lazy" decoding="async"></span>` : ''}
  <span class="body">
   <span class="top"><span class="ico">${svg(s.icon)}</span><h2>${esc(s.title)}</h2></span>
   <p>${esc(s.desc)}</p>
   <span class="go">ادخل الموقع ${arrow}</span>
  </span>
 </a></li>`).join('') + `
 <li><div class="site soon" aria-label="مواقع قادمة بإذن الله">
  <span class="body"><span class="ico">${svg('soon')}</span><h2>مواقع قادمة بإذن الله</h2></span>
 </div></li>`;
</script>
</body>
</html>
