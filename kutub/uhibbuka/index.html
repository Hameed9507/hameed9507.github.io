<meta property="og:title" content="والله إني لأحبك لله">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@500;700;900&display=swap">
<style>
:root{color-scheme:light dark;
 --bg:light-dark(#F7EEDF,#1E1712);--card:light-dark(#FFFBF4,#2B211A);
 --ink:light-dark(#3B2416,#F3E6D3);--soft:light-dark(#7A5A44,#C9B39C);--line:light-dark(#E3D2B6,#3E3127);
 --accent:light-dark(#B5562F,#E59A6E)}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.7 Tajawal,'Noto Naskh Arabic',sans-serif;overflow-x:clip}
.wrap{width:100%;max-width:600px;margin:0 auto;padding:0 max(4vw,12px)}
.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:56px}
.home{display:inline-flex;align-items:center;gap:6px;color:var(--ink);text-decoration:none;font:700 21px/1.4 Amiri,serif;white-space:nowrap}
.home svg{width:18px;height:18px;color:var(--soft)}
.dl{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none;color:#fff;background:var(--accent);font-weight:900;font-size:15px;line-height:1;border-radius:999px;padding:10px 15px 9px;min-height:40px}
.dl svg{width:16px;height:16px}
header{text-align:center;padding:26px 0 18px}
h1{font:700 clamp(30px,8.4vw,44px)/1.45 Amiri,serif;margin:0}
.sub{font-weight:700;font-size:clamp(16px,4.6vw,19px);color:var(--soft);margin:4px 0 0}
.meta{font-weight:500;font-size:15px;color:var(--soft);margin:6px 0 0}
.pages{display:grid;gap:14px}
.pages img{display:block;width:100%;height:auto;border-radius:16px;background:var(--card);box-shadow:0 8px 24px rgba(60,30,10,.12)}
.end{text-align:center;padding:28px 0 8px;display:grid;gap:14px;justify-items:center}
.end .dl{font-size:16px;padding:12px 20px 11px}
.next{color:var(--ink);text-decoration:none;font-weight:700;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:12px 18px;line-height:1.5}
.next small{display:block;color:var(--soft);font-weight:500;font-size:14px}
.next b{font:700 22px/1.5 Amiri,serif}
footer{text-align:center;padding:30px 16px 44px}
.credit{font:700 26px/1.6 Amiri,serif;margin:0 auto;display:table;padding:0 6px;background:linear-gradient(90deg,light-dark(#C4512A,#F2A27A),light-dark(#C98A12,#F3CF72));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
</style>
</head>
